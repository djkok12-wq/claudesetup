<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>33평 전체 인테리어 3D 시뮬레이터 · 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F0EEE9;--ink:#24211e;--sub:#7a736a;--line:#e1dcd3;--card:#fbfaf7;--acc:#57504C;--acc2:#B8A992;--hi:#2f6f62}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:#faf9f6}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-size:15px;letter-spacing:-.2px}.brand span{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr{display:flex;align-items:center;gap:8px}
#totalChip{font-size:12px;color:var(--sub);white-space:nowrap}#totalChip b{color:var(--ink);font-size:14px}
.seg{display:inline-flex;background:#e9e5de;border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.btn{background:var(--ink);color:#fff;border-radius:10px;padding:9px 14px;font-weight:500;font-size:13px}
.btn.ghost{background:#e9e5de;color:var(--ink);padding:7px 10px}
main{flex:1;display:grid;grid-template-columns:1fr 410px;min-height:0}
#viewport{position:relative;min-height:0;overflow:hidden;background:#e8e5df}
#viewport canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none}
.rlabel{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;background:rgba(255,255,255,.86);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border-radius:8px;padding:3px 8px;text-align:center;line-height:1.25;box-shadow:0 1px 4px rgba(0,0,0,.1);transition:opacity .2s}
.rlabel b{display:block;font-size:11.5px}.rlabel span{font-size:10px;color:var(--sub)}
#walkHud{display:none;position:absolute;left:12px;bottom:12px;right:12px;pointer-events:none;align-items:flex-end;justify-content:space-between;gap:10px}
body.walking #walkHud{display:flex}
#walkHud select{pointer-events:auto;font:inherit;padding:8px 10px;border-radius:10px;border:0;background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.15)}
#walkHud p{color:#fff;font-size:11.5px;text-shadow:0 1px 3px rgba(0,0,0,.6);flex:1}
#pad{pointer-events:auto;display:grid;grid-template-columns:repeat(2,52px);gap:6px}
#pad button{height:46px;border-radius:12px;background:rgba(255,255,255,.88);font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.15);user-select:none;-webkit-user-select:none;touch-action:none}
#toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-10px);background:rgba(36,33,30,.9);color:#fff;padding:8px 14px;border-radius:20px;font-size:12.5px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--bg);transition:opacity .5s;color:var(--sub)}
#loading.off{opacity:0;pointer-events:none}
.spin{width:28px;height:28px;border:3px solid #ddd6cb;border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
aside{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:#faf9f6}
#tabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px}
#tabs button{flex:1;padding:12px 4px;font-size:13.5px;color:var(--sub);border-bottom:2px solid transparent}
#tabs button.on{color:var(--ink);font-weight:700;border-color:var(--ink)}
#pane{flex:1;overflow-y:auto;padding:14px 16px 40px;-webkit-overflow-scrolling:touch;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
section{margin-bottom:22px}
h2{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:6px}h2 em{font-style:normal;font-size:11px;background:var(--acc);color:#fff;border-radius:6px;padding:1px 6px}
.hint{font-size:12px;color:var(--sub);margin:6px 0 10px;line-height:1.5}
.concepts{display:grid;gap:10px}
.concept{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;transition:.15s}
.concept:hover{border-color:var(--acc2)}.concept.on{border-color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.concept .chips{display:flex;margin-bottom:8px}.concept .chips i{width:26px;height:26px;border-radius:50%;border:2px solid #fff;margin-right:-6px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.concept h3{font-size:14px;display:flex;align-items:baseline;gap:6px}.concept h3 small{font-weight:400;font-size:11px;color:var(--sub)}
.concept p{font-size:12.3px;color:#5d574f;line-height:1.55;margin:4px 0 8px}
.keys{display:flex;flex-wrap:wrap;gap:4px}.keys span{font-size:11px;background:#ece8e0;border-radius:6px;padding:2px 7px;color:#5d574f}
.tg{display:flex;align-items:flex-start;gap:10px;padding:8px 0;cursor:pointer;border-bottom:1px dashed var(--line)}
.tg input{display:none}.tg>span{flex:none;width:36px;height:21px;border-radius:12px;background:#d9d3c9;position:relative;transition:.2s;margin-top:1px}
.tg>span:after{content:'';position:absolute;left:2px;top:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tg input:checked+span{background:var(--hi)}.tg input:checked+span:after{left:17px}
.tg div{font-size:13px;line-height:1.35}.tg small{display:block;font-size:11.5px;color:var(--sub)}
.tg.sm{border:0}
.kel{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12.5px}.kel input{flex:1;accent-color:var(--acc)}
.zones{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;position:sticky;top:-14px;background:#faf9f6;z-index:2;padding-top:4px}
.zones button{flex:none;padding:6px 12px;border-radius:16px;background:#ece8e0;font-size:12.5px}.zones button.on{background:var(--ink);color:#fff}
.slot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;scroll-margin-top:44px;transition:box-shadow .3s}
.slot.pulse{box-shadow:0 0 0 3px rgba(47,111,98,.35)}
.sh{display:flex;align-items:baseline;gap:8px}.sh h3{font-size:14px}.sh span{font-size:11.5px;color:var(--sub)}
.qty{font-size:11.5px;color:var(--sub);margin:3px 0 8px}.qty b{color:var(--ink)}
.items{display:grid;gap:6px}
.item{display:flex;gap:10px;text-align:left;padding:7px;border-radius:10px;border:1.5px solid transparent;background:#fff;align-items:center}
.item:hover{border-color:var(--line)}.item.on{border-color:var(--hi);background:#f3f8f6}
.item img{width:52px;height:52px;border-radius:8px;flex:none;object-fit:cover;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.item div{min-width:0;display:flex;flex-direction:column;gap:1px}.item b{font-size:12.8px}.item small{font-size:11px;color:var(--sub);line-height:1.35}
.item .pr{font-size:11px;color:#5d574f}.item em{font-style:normal;align-self:flex-start;font-size:10px;background:#e7efe9;color:var(--hi);border-radius:5px;padding:0 5px;margin-top:2px}
.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.big small{display:block;font-size:12px;color:var(--sub)}.big b{font-size:28px;letter-spacing:-.5px}.big span{display:block;font-size:12px;color:var(--sub)}
.range{margin:12px 0}.bar{position:relative;height:10px;background:#ece8e0;border-radius:6px;margin-bottom:6px}
.bar .mk{position:absolute;top:0;bottom:0;background:#c9c2b6;border-radius:6px}.bar .me{position:absolute;top:-4px;width:4px;height:18px;margin-left:-2px;background:var(--hi);border-radius:2px}
.range small{font-size:11px;color:var(--sub)}
.sum .btn{width:100%;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
.est td,.est th{padding:6px 4px;border-bottom:1px solid #ece8e0;text-align:right;vertical-align:top}
.est td:first-child,.est th:first-child{text-align:left}.est small{display:block;color:var(--sub);font-size:10.5px}
.est th{font-size:11px;color:var(--sub);font-weight:500}
.est tr.cat td{font-weight:700;background:#f1eee8;padding-top:7px}.est tr.tot td{font-weight:700;font-size:14px;border-top:2px solid var(--ink)}
.note{font-size:11.3px;color:var(--sub);line-height:1.55;margin-top:10px}
.doc h2{font-size:18px}.doc .meta{font-size:11.5px;color:var(--sub);margin:-4px 0 12px}
.doc h3{font-size:14px;margin:18px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.doc ul{padding-left:18px;line-height:1.6;font-size:12.6px}.doc li{margin-bottom:4px}
.doc table th,.doc table td{padding:6px;border-bottom:1px solid #ece8e0;text-align:left;vertical-align:top;font-size:12px}
.doc table th{width:64px;color:var(--sub);font-weight:500}
.doc table.small thead th{width:auto}.doc table small{display:block;color:var(--sub);font-size:10.5px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.callout{background:#f3efe6;border-left:3px solid var(--acc);padding:10px 12px;border-radius:0 10px 10px 0;font-size:12.5px;line-height:1.6;margin:12px 0}
.callout b{display:block;margin-bottom:2px}
.check li{list-style:'☐  '}
.src{padding-left:18px;font-size:11.5px;line-height:1.7}.src a{color:var(--hi)}
#shot{position:fixed;inset:0;background:rgba(20,18,16,.75);display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
#shot.on{display:flex}#shot div{max-width:900px;text-align:center}#shot img{max-width:100%;max-height:75vh;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
#shot p{color:#eee;font-size:12px;margin-top:10px}
@media (max-width:900px){
  header{flex-wrap:wrap;gap:8px;padding:8px 12px}
  .brand{flex-basis:100%}.brand span{font-size:11px}
  #views{flex:1}#views button{flex:1;padding:6px 8px}
  main{grid-template-columns:1fr;grid-template-rows:52vh 1fr}
  aside{border-left:0;border-top:1px solid var(--line)}
  #walkHud p{display:none}
  .rlabel{padding:2px 6px}.rlabel b{font-size:10.5px}.rlabel span{display:none}
}

</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<body>
<div id="app">
  <header>
    <div class="brand"><b>33평 리모델링 시뮬레이터</b><span>화정마을4단지 아이파크가야 · 84㎡ · 2026 트렌드</span></div>
    <div id="views" class="seg"><button data-v="orbit">조감</button><button data-v="top">평면</button><button data-v="walk">워크스루</button></div>
    <div class="hr"><span id="totalChip"></span><button id="snap" class="btn ghost" title="현재 화면 이미지">📷</button></div>
  </header>
  <main>
    <div id="viewport">
      <div id="labels"></div>
      <div id="walkHud">
        <select id="roomSel" aria-label="공간 이동"></select>
        <p>드래그: 둘러보기 · W/A/S/D·방향키: 이동 · Shift: 빠르게</p>
        <div id="pad"><button data-k="w">▲</button><button data-k="q">⟲</button><button data-k="s">▼</button><button data-k="e">⟳</button></div>
      </div>
      <div id="toast"></div>
      <div id="loading"><div class="spin"></div><p>3D 모델과 자재 텍스처를 만들고 있어요…</p></div>
    </div>
    <aside>
      <nav id="tabs"><button data-t="concept">컨셉·옵션</button><button data-t="finish">마감재</button><button data-t="estimate">견적</button><button data-t="plan">기획서</button></nav>
      <div id="pane"></div>
    </aside>
  </main>
</div>
<div id="shot"><div><img id="shotImg" alt="스냅샷"><p>이미지를 길게 누르거나 우클릭해서 저장하세요 · 바깥을 누르면 닫혀요</p></div></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
// ============================================================
//  DATA : 평면 · 마감재 카탈로그 · 컨셉 프리셋 · 견적 기준
//  단위: 평면 좌표 mm (x: 좌→우, z: 북(상)→남(하)), 높이 mm
// ============================================================

const PLAN_META = {
  name: '화정마을4단지 아이파크가야 413동 · 84㎡ (33평형)',
  supply: 112.1, exclusive: 84.96, pyeong: 33,
  ceiling: 2300, doorH: 2100, wallT: 200,
};

// ---------- 공간 (중심선 기준 사각형) ----------
function getRooms(s) {
  const BAL = { floor: 'floor_balcony', wall: 'wall_balcony', kind: 'bal' };
  return [
    { id: 'living', name: '거실', x1: 4090, z1: 8800, x2: 8780, z2: 13515, floor: 'floor_main', wall: 'wall_living', kind: 'dry', feature: { edge: 'left', slot: 'wall_feature' }, lights: 6 },
    { id: 'kitchen', name: '주방·식당', x1: 4090, z1: 5085, x2: 8010, z2: 8800, floor: 'floor_main', wall: 'wall_kitchen', kind: 'dry', lights: 4 },
    { id: 'hallL', name: '침실 복도', x1: 2600, z1: 7755, x2: 4090, z2: 9690, floor: 'floor_main', wall: 'wall_living', kind: 'dry', lights: 1, nolabel: true },
    { id: 'hallA', name: '복도', x1: 8010, z1: 7225, x2: 9700, z2: 8800, floor: 'floor_main', wall: 'wall_living', kind: 'dry', lights: 1, nolabel: true },
    { id: 'hallB', name: '복도', x1: 8780, z1: 8800, x2: 9700, z2: 10280, floor: 'floor_main', wall: 'wall_living', kind: 'dry', lights: 1, nolabel: true },
    { id: 'hallC', name: '복도 수납', x1: 9700, z1: 9620, x2: 11970, z2: 10280, floor: 'floor_main', wall: 'wall_living', kind: 'dry', lights: 1, nolabel: true },
    { id: 'entry', name: '현관', x1: 8010, z1: 4800, x2: 9700, z2: 7225, floor: 'floor_entry', wall: 'wall_living', kind: 'entry', floorY: -120, lights: 1 },
    { id: 'master', name: '안방', x1: 0, z1: 9690, x2: 4090, z2: 13515, floor: 'floor_main', wall: 'wall_master', kind: 'dry', lights: 4 },
    { id: 'dress', name: s.dress ? '안방 드레스룸' : '안방 앞 전실', x1: 0, z1: 7755, x2: 2600, z2: 9690, floor: 'floor_main', wall: 'wall_master', kind: 'dry', lights: 2 },
    { id: 'mbath', name: '욕실1', x1: 0, z1: 5085, x2: 1745, z2: 7755, floor: 'bath_floor', wall: 'bath_wall', kind: 'wet', lights: 2 },
    { id: 'bed3', name: '침실3·서재', x1: 1745, z1: 5085, x2: 4090, z2: 7755, floor: 'floor_main', wall: 'wall_bed3', kind: 'dry', lights: 2 },
    { id: 'bed2', name: '침실2·자녀방', x1: 8780, z1: 10280, x2: 11970, z2: 13515, floor: 'floor_main', wall: 'wall_bed2', kind: 'dry', lights: 4 },
    { id: 'cbath', name: '욕실2(공용)', x1: 9700, z1: 7225, x2: 11970, z2: 9620, floor: 'bath_floor', wall: 'bath_wall', kind: 'wet', lights: 2 },
    { id: 'utility', name: '다용도실', x1: 4090, z1: 3185, x2: 8010, z2: 5085, ...BAL, lights: 1 },
    { id: 'nbal', name: '북측 발코니', x1: 0, z1: 3485, x2: 4090, z2: 5085, ...BAL, lights: 1 },
    { id: 'mbal', name: '안방 발코니', x1: 0, z1: 13515, x2: 4090, z2: 15015, ...BAL, lights: 1 },
    s.expand
      ? { id: 'lbal', name: '거실 확장부', x1: 4090, z1: 13515, x2: 8780, z2: 15015, floor: 'floor_main', wall: 'wall_living', kind: 'dry', lights: 2, nolabel: true }
      : { id: 'lbal', name: '거실 발코니', x1: 4090, z1: 13515, x2: 8780, z2: 15015, ...BAL, lights: 1 },
    { id: 'bbal', name: '침실2 발코니', x1: 8780, z1: 13515, x2: 11970, z2: 14700, ...BAL, lights: 1 },
  ];
}

// ---------- 개구부 ----------
// line 'h' = z 고정 수평선(x a..b), 'v' = x 고정 수직선(z a..b)
// type: open | door | arch | window | slidewin | entry | slide(중문)
// swing: 문짝이 열리는 방향(+1: 좌표 증가 방향), hinge: 'a' | 'b'
function getOpenings(s) {
  const O = [
    { line: 'h', at: 8800, a: 4090, b: 9700, type: 'open' },
    { line: 'v', at: 4090, a: 7755, b: 9690, type: 'open' },
    { line: 'v', at: 8010, a: 7225, b: 8800, type: 'open' },
    { line: 'v', at: 8780, a: 8800, b: 10280, type: 'open' },
    { line: 'v', at: 9700, a: 9620, b: 10280, type: 'open' },
    { line: 'h', at: 7755, a: 3150, b: 3950, type: 'door', swing: -1, hinge: 'b' },   // 침실3
    { line: 'h', at: 9690, a: 3150, b: 3950, type: 'door', swing: 1, hinge: 'b' },    // 안방
    { line: 'h', at: 7755, a: 450, b: 1250, type: 'door', swing: -1, hinge: 'a', bath: true }, // 욕실1
    { line: 'v', at: 9700, a: 7650, b: 8450, type: 'door', swing: 1, hinge: 'b', bath: true }, // 욕실2
    { line: 'h', at: 10280, a: 8900, b: 9700, type: 'door', swing: 1, hinge: 'a' },   // 침실2
    { line: 'h', at: 5085, a: 4300, b: 5100, type: 'door', swing: -1, hinge: 'a', glass: true }, // 다용도실
    { line: 'v', at: 9700, a: 5300, b: 6300, type: 'entry' },                          // 현관문
    { line: 'h', at: 7225, a: 8110, b: 9600, type: 'slide' },                          // 중문
    // 창호
    { line: 'h', at: 5085, a: 5600, b: 7400, type: 'window', sill: 1000, head: 2100 },  // 주방창
    { line: 'h', at: 5085, a: 2100, b: 3800, type: 'slidewin', sill: 0, head: 2100 },   // 침실3→북측발코니
    { line: 'h', at: 5085, a: 500, b: 1200, type: 'window', sill: 1500, head: 2100 },   // 욕실1 창
    { line: 'h', at: 13515, a: 300, b: 3800, type: 'slidewin', sill: 0, head: 2100 },   // 안방
    { line: 'h', at: 13515, a: 9000, b: 11800, type: 'slidewin', sill: 0, head: 2100 }, // 침실2
    { line: 'h', at: 15015, a: 200, b: 3900, type: 'window', sill: 900, head: 2200, ext: true },
    { line: 'h', at: 15015, a: 4290, b: 8580, type: 'window', sill: s.expand ? 450 : 900, head: 2200, ext: true },
    { line: 'h', at: 14700, a: 8980, b: 11770, type: 'window', sill: 900, head: 2200, ext: true },
    { line: 'h', at: 3185, a: 4300, b: 7800, type: 'window', sill: 900, head: 2200, ext: true },
    { line: 'h', at: 3485, a: 200, b: 3900, type: 'window', sill: 900, head: 2200, ext: true },
  ];
  // 거실 ↔ 발코니

function rng(seed) {
  let a = seed >>> 0;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgbStr(r, g, b, a = 1) { return `rgba(${r | 0},${g | 0},${b | 0},${a})`; }
function shade(hex, f) { // f: -1..1 밝기 조절
  const [r, g, b] = hexToRgb(hex);
  const t = f < 0 ? 0 : 255, p = Math.abs(f);
  return rgbStr(r + (t - r) * p, g + (t - g) * p, b + (t - b) * p);
}
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

function noise(ctx, w, h, amt, R, scale = 1) {

  ctx.putImageData(img, 0, 0);
}

  const [ax, bx] = x1 < x2 ? [x1, x2] : [x2, x1], [az, bz] = z1 < z2 ? [z1, z2] : [z2, z1];
  const g = new THREE.BoxGeometry(Math.max(1, bx - ax) / 1000, Math.max(1, y2 - y1) / 1000, Math.max(1, bz - az) / 1000);
  g.translate(WX((ax + bx) / 2), (y1 + y2) / 2000, WZ((az + bz) / 2));
  worldUV(g);
  const m = new THREE.Mesh(g, mat);
  m.castShadow = o.cast ?? true; m.receiveShadow = true;
  if (o.slot) m.userData.slot = o.slot; if (o.room) m.userData.room = o.room; if (o.nopick) m.userData.nopick = true;
  parent.add(m); return m;
}
function cyl(parent, x, z, r, y1, y2, mat, seg = 24, o = {}) {
  const g = new THREE.CylinderGeometry(r / 1000, (o.r2 ?? r) / 1000, (y2 - y1) / 1000, seg);
  g.translate(WX(x), (y1 + y2) / 2000, WZ(z));
  const m = new THREE.Mesh(g, mat); m.castShadow = true; m.receiveShadow = true;
  if (o.slot) m.userData.slot = o.slot; parent.add(m); return m;
}

let ROOMS = [], OPEN = [], root, vertical, ceilGroup, uppers, furn, ledMeshes = [], roomLights = [];

function subtract(segs, a, b) { const out = []; for (const [s, t] of segs) { if (b <= s || a >= t) { out.push([s, t]); continue; } if (a > s) out.push([s, a]); if (b < t) out.push([b, t]); } return out; }

// ---------- 벽 ----------
function wallPiece(room, e, s, t, yA, yB, slot, solid) {

  else { mats[e.inward > 0 ? 0 : 1] = inner; mats[4] = mats[5] = inner; }
  box(vertical, x1, z1, x2, z2, yA, yB, mats, { slot, room: room.id });
  qty.wall[slot] = (qty.wall[slot] || 0) + (t - s) / 1000 * (yB - yA) / 1000;
  // 외벽 판정 → 바깥쪽 절반 추가
  const mid = (s + t) / 2, probe = e.line === 'h' ? [mid, e.at - e.inward * 150] : [e.at - e.inward * 150, mid];
  if (!roomAt(probe[0], probe[1])) {

    if (e.line === 'h') box(vertical, s, e.at, t, e.at - e.inward * (HALF + 40), yA, yB, m2, { nopick: true });
    else box(vertical, e.at, s, e.at - e.inward * (HALF + 40), t, yA, yB, m2, { nopick: true });
  }
  // 걸레받이
  if (solid && room.kind === 'dry' && yA <= 0) {
    const bb = itemOf('baseboard');
    const bm = bb.color === 'wall' ? getMat(slot) : bb.color === 'floor' ? getMat('floor_main') : fm('bb_' + bb.id, bb.color, bb.rough);
    const pr = bb.inset ? 1 : 10, f = HALF;
    if (e.line === 'h') box(vertical, s, e.at + e.inward * f, t, e.at + e.inward * (f + pr), 0, bb.h, bm, { slot: 'baseboard', cast: false });
    else box(vertical, e.at + e.inward * f, s, e.at + e.inward * (f + pr), t, 0, bb.h, bm, { slot: 'baseboard', cast: false });

}
function buildWalls(room) {
  const y0 = room.floorY || 0;
  const edges = [
    { name: 'top', line: 'h', at: room.z1, a: room.x1, b: room.x2, inward: 1 },
    { name: 'bottom', line: 'h', at: room.z2, a: room.x1, b: room.x2, inward: -1 },
    { name: 'left', line: 'v', at: room.x1, a: room.z1, b: room.z2, inward: 1 },
    { name: 'right', line: 'v', at: room.x2, a: room.z1, b: room.z2, inward: -1 },
  ];
  for (const e of edges) {
    const slot = room.feature && room.feature.edge === e.name ? room.feature.slot : room.wall;
    const ops = OPEN.filter(o => o.line === e.line && Math.abs(o.at - e.at) < 3 && o.a < e.b && o.b > e.a);
    let segs = [[e.a, e.b]];
    for (const o of ops) segs = subtract(segs, o.a, o.b);
    for (const [s, t] of segs) wallPiece(room, e, s, t, y0, H, slot, true);
    for (const o of ops) {
      const s = Math.max(o.a, e.a), t = Math.min(o.b, e.b);
      if (o.type === 'open') continue;
      if (['door', 'arch', 'entry', 'slide'].includes(o.type)) wallPiece(room, e, s, t, DOOR_H, H, slot);
      else { if (o.sill > 0) wallPiece(room, e, s, t, y0, o.sill, slot); if (o.head < H) wallPiece(room, e, s, t, o.head, H, slot); }
    }
  }
}

let flash = null;

function resize() {
  const w = viewport.clientWidth, h = viewport.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
let homed = false;
new ResizeObserver(() => { resize(); if (!homed && viewport.clientWidth) { homed = true; setOrbitHome(); } }).observe(viewport);
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (state.view === 'walk') {
    const k = walk.keys, sp = (k.shift ? 2.6 : 1.5) * dt;
    let f = (k.w || k.arrowup ? 1 : 0) - (k.s || k.arrowdown ? 1 : 0), st = (k.d ? 1 : 0) - (k.a ? 1 : 0);
    if (k.arrowleft || k.q) walk.yaw += 1.8 * dt; if (k.arrowright || k.e) walk.yaw -= 1.8 * dt;
    const fx = -Math.sin(walk.yaw), fz = -Math.cos(walk.yaw);
    const dx = (fx * f - fz * st) * sp, dz = (fz * f + fx * st) * sp;
    if (canWalk(walk.pos.x + dx, walk.pos.z)) walk.pos.x += dx;
    if (canWalk(walk.pos.x, walk.pos.z + dz)) walk.pos.z += dz;
    camera.position.copy(walk.pos); camera.rotation.set(walk.pitch, walk.yaw, 0, 'YXZ');
  } else {
    if (tween) {
      tween.t = Math.min(1, tween.t + dt * 1.8); const e = 1 - Math.pow(1 - tween.t, 3);
      controls.target.lerpVectors(tween.from, tween.to, e); camera.position.lerpVectors(tween.fromP, tween.toP, e);
      if (tween.t >= 1) tween = null;
    }
    controls.update();
  }
  if (flash) { flash.t += dt; const a = Math.max(0, Math.sin(flash.t * 9) * (1 - flash.t / 1.4)); flash.m.emissive.setRGB(a * .25, a * .45, a * .7); if (flash.t > 1.4) { flash.m.emissive.set('#000'); flash = null; } }
  renderer.render(scene, camera);

}

const swCache = {};

  const key = item.id;

  const it = item.color === 'ctop' ? itemOf('countertop') : item;
  const c = document.createElement('canvas'); c.width = c.height = 96; const ctx = c.getContext('2d');
  const t = it.tex && it.tex.k !== 'paint' ? texFor(it) : null;
  if (t) { const s = t.canvas; const cw = Math.min(s.width, s.height) * .55; ctx.drawImage(s, 0, 0, cw, cw, 0, 0, 96, 96); }
  else if (it.color === 'wall' || it.color === 'floor') { ctx.fillStyle = '#ddd'; ctx.fillRect(0, 0, 96, 96); ctx.fillStyle = '#999'; ctx.font = '600 20px sans-serif'; ctx.fillText(it.color === 'wall' ? '벽색' : '마루색', 18, 56); }
  else {
    ctx.fillStyle = it.color; ctx.fillRect(0, 0, 96, 96);
    if (it.glass) { ctx.fillStyle = it.glass; ctx.globalAlpha = .7; ctx.fillRect(16, 10, 64, 76); ctx.globalAlpha = 1; }
    if (it.metal) { const g = ctx.createLinearGradient(0, 0, 96, 96); g.addColorStop(0, 'rgba(255,255,255,.45)'); g.addColorStop(.5, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(0,0,0,.25)'); ctx.fillStyle = g; ctx.fillRect(0, 0, 96, 96); }
  }
  return (swCache[key] = c.toDataURL('image/jpeg', .85));
}

const CAT_OF = { floor_main: '바닥', floor_entry: '타일', floor_balcony: '타일', wall_living: '도배·도장', wall_kitchen: '도배·도장', wall_master: '도배·도장', wall_bed2: '도배·도장', wall_bed3: '도배·도장', wall_balcony: '도배·도장', wall_feature: '아트월', baseboard: '목공', door: '도어·중문', jungmun: '도어·중문', kitchen_lower: '주방', kitchen_upper: '주방', countertop: '주방', backsplash: '주방', shoe: '가구', closet: '가구', bath_wall: '욕실', bath_floor: '욕실', bath_fixture: '욕실' };
function qtyOf(slot) {
  const c = CATALOG[slot];
  switch (c.qty) {
    case 'floor': return (qty.floor[slot] || 0) * .92;
    case 'wall': return qty.wall[slot] || 0;
    case 'base': return qty.base; case 'doors': return qty.doors; case 'one': return 1; case 'baths': return qty.baths;
    default: return qty[c.qty] || 0;
  }
}
function estimate() {
  const lines = [];
  for (const slot in CATALOG) {
    const it = itemOf(slot), q = qtyOf(slot);
    if (!q) continue;
    lines.push({ cat: CAT_OF[slot] || '기타', name: CATALOG[slot].label, item: it.name, q, unit: CATALOG[slot].unit, price: it.price, amt: q * it.price, slot });
  }
  for (const f of FIXED_COSTS) {
    let amt = f.amt, q = 1, unit = '식', price = f.amt;
    if (f.perM2) { q = qty.ceiling * .92; unit = '㎡'; price = f.perM2; amt = q * price; }
    if (f.perBath) { q = qty.baths; unit = '개소'; price = f.perBath; amt = q * price; }
    lines.push({ cat: '공통', name: f.name, item: f.note, q, unit, price, amt });
  }
  for (const k of ['sash', 'expand', 'dress', 'cove']) if (state[k]) { const o = OPTION_COSTS[k]; lines.push({ cat: '옵션', name: o.name, item: o.note, q: 1, unit: '식', price: o.amt, amt: o.amt }); }
  const sub = lines.reduce((s, l) => s + l.amt, 0), mg = sub * MGMT_RATE, vat = state.vat ? (sub + mg) * .1 : 0;
  return { lines, sub, mg, vat, total: sub + mg + vat };
}

function applyConcept(id) {
  const c = CONCEPTS.find(c => c.id === id);
  state.concept = id; state.sel = { ...c.pick }; state.kelvin = c.light.k;
  applyAll(); build(); saveState(); render(); updateTotal();
  toast(`'${c.name}' 컨셉을 적용했어요`);
}

roomSel.innerHTML = Object.keys(SPOTS).map(k => `<option value="${k}">${(getRooms(state).find(r => r.id === k) || {}).name || k}</option>`).join('');
roomSel.onchange = () => goSpot(roomSel.value);
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); walk.keys[k] = true; }, off = () => { walk.keys[k] = false; };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);
});
$('#snap').onclick = () => { $('#shotImg').src = snapshot(); $('#shot').classList.add('on'); };
$('#shot').onclick = e => { if (e.target.id !== 'shotImg') $('#shot').classList.remove('on'); };

// ---------- 시작 ----------
applyAll(); build(); render(); updateTotal(); window.onViewChange();
requestAnimationFrame(loop);
setTimeout(() => $('#loading').classList.add('off'), 200);
window.SIM = { state, setView, goSpot, applyLighting, build, applyConcept, estimate };

</script>
</body>
