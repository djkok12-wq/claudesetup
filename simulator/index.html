<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>33평 전체 인테리어 3D 시뮬레이터 · 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F0EEE9;--ink:#24211e;--sub:#7a736a;--line:#e1dcd3;--card:#fbfaf7;--acc:#57504C;--acc2:#B8A992;--hi:#2f6f62}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:#faf9f6}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-size:15px;letter-spacing:-.2px}.brand span{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr{display:flex;align-items:center;gap:8px}
#totalChip{font-size:12px;color:var(--sub);white-space:nowrap}#totalChip b{color:var(--ink);font-size:14px}
.seg{display:inline-flex;background:#e9e5de;border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:8px;font-size:13px;color:var(--sub);white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.btn{background:var(--ink);color:#fff;border-radius:10px;padding:9px 14px;font-weight:500;font-size:13px}
.btn.ghost{background:#e9e5de;color:var(--ink);padding:7px 10px}
main{flex:1;display:grid;grid-template-columns:1fr 410px;min-height:0}
#viewport{position:relative;min-height:0;overflow:hidden;background:#e8e5df}
#viewport canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none}
.rlabel{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;background:rgba(255,255,255,.86);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border-radius:8px;padding:3px 8px;text-align:center;line-height:1.25;box-shadow:0 1px 4px rgba(0,0,0,.1);transition:opacity .2s}
.rlabel b{display:block;font-size:11.5px}.rlabel span{font-size:10px;color:var(--sub)}
#walkHud{display:none;position:absolute;left:12px;bottom:12px;right:12px;pointer-events:none;align-items:flex-end;justify-content:space-between;gap:10px}
body.walking #walkHud{display:flex}
#walkHud select{pointer-events:auto;font:inherit;padding:8px 10px;border-radius:10px;border:0;background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.15)}
#walkHud p{color:#fff;font-size:11.5px;text-shadow:0 1px 3px rgba(0,0,0,.6);flex:1}
#pad{pointer-events:auto;display:grid;grid-template-columns:repeat(2,52px);gap:6px}
#pad button{height:46px;border-radius:12px;background:rgba(255,255,255,.88);font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.15);user-select:none;-webkit-user-select:none;touch-action:none}
#toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-10px);background:rgba(36,33,30,.9);color:#fff;padding:8px 14px;border-radius:20px;font-size:12.5px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--bg);transition:opacity .5s;color:var(--sub)}
#loading.off{opacity:0;pointer-events:none}
.spin{width:28px;height:28px;border:3px solid #ddd6cb;border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
aside{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:#faf9f6}
#tabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px}
#tabs button{flex:1;padding:12px 4px;font-size:13.5px;color:var(--sub);border-bottom:2px solid transparent}
#tabs button.on{color:var(--ink);font-weight:700;border-color:var(--ink)}
#pane{flex:1;overflow-y:auto;padding:14px 16px 40px;-webkit-overflow-scrolling:touch;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
section{margin-bottom:22px}
h2{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:6px}h2 em{font-style:normal;font-size:11px;background:var(--acc);color:#fff;border-radius:6px;padding:1px 6px}
.hint{font-size:12px;color:var(--sub);margin:6px 0 10px;line-height:1.5}
.concepts{display:grid;gap:10px}
.concept{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;transition:.15s}
.concept:hover{border-color:var(--acc2)}.concept.on{border-color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.concept .chips{display:flex;margin-bottom:8px}.concept .chips i{width:26px;height:26px;border-radius:50%;border:2px solid #fff;margin-right:-6px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.concept h3{font-size:14px;display:flex;align-items:baseline;gap:6px}.concept h3 small{font-weight:400;font-size:11px;color:var(--sub)}
.concept p{font-size:12.3px;color:#5d574f;line-height:1.55;margin:4px 0 8px}
.keys{display:flex;flex-wrap:wrap;gap:4px}.keys span{font-size:11px;background:#ece8e0;border-radius:6px;padding:2px 7px;color:#5d574f}
.tg{display:flex;align-items:flex-start;gap:10px;padding:8px 0;cursor:pointer;border-bottom:1px dashed var(--line)}
.tg input{display:none}.tg>span{flex:none;width:36px;height:21px;border-radius:12px;background:#d9d3c9;position:relative;transition:.2s;margin-top:1px}
.tg>span:after{content:'';position:absolute;left:2px;top:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tg input:checked+span{background:var(--hi)}.tg input:checked+span:after{left:17px}
.tg div{font-size:13px;line-height:1.35}.tg small{display:block;font-size:11.5px;color:var(--sub)}
.tg.sm{border:0}
.kel{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12.5px}.kel input{flex:1;accent-color:var(--acc)}
.zones{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;position:sticky;top:-14px;background:#faf9f6;z-index:2;padding-top:4px}
.zones button{flex:none;padding:6px 12px;border-radius:16px;background:#ece8e0;font-size:12.5px}.zones button.on{background:var(--ink);color:#fff}
.slot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;scroll-margin-top:44px;transition:box-shadow .3s}
.slot.pulse{box-shadow:0 0 0 3px rgba(47,111,98,.35)}
.sh{display:flex;align-items:baseline;gap:8px}.sh h3{font-size:14px}.sh span{font-size:11.5px;color:var(--sub)}
.qty{font-size:11.5px;color:var(--sub);margin:3px 0 8px}.qty b{color:var(--ink)}
.items{display:grid;gap:6px}
.item{display:flex;gap:10px;text-align:left;padding:7px;border-radius:10px;border:1.5px solid transparent;background:#fff;align-items:center}
.item:hover{border-color:var(--line)}.item.on{border-color:var(--hi);background:#f3f8f6}
.item img{width:52px;height:52px;border-radius:8px;flex:none;object-fit:cover;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.item div{min-width:0;display:flex;flex-direction:column;gap:1px}.item b{font-size:12.8px}.item small{font-size:11px;color:var(--sub);line-height:1.35}
.item .pr{font-size:11px;color:#5d574f}.item em{font-style:normal;align-self:flex-start;font-size:10px;background:#e7efe9;color:var(--hi);border-radius:5px;padding:0 5px;margin-top:2px}
.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.big small{display:block;font-size:12px;color:var(--sub)}.big b{font-size:28px;letter-spacing:-.5px}.big span{display:block;font-size:12px;color:var(--sub)}
.range{margin:12px 0}.bar{position:relative;height:10px;background:#ece8e0;border-radius:6px;margin-bottom:6px}
.bar .mk{position:absolute;top:0;bottom:0;background:#c9c2b6;border-radius:6px}.bar .me{position:absolute;top:-4px;width:4px;height:18px;margin-left:-2px;background:var(--hi);border-radius:2px}
.range small{font-size:11px;color:var(--sub)}
.sum .btn{width:100%;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
.est td,.est th{padding:6px 4px;border-bottom:1px solid #ece8e0;text-align:right;vertical-align:top}
.est td:first-child,.est th:first-child{text-align:left}.est small{display:block;color:var(--sub);font-size:10.5px}
.est th{font-size:11px;color:var(--sub);font-weight:500}
.est tr.cat td{font-weight:700;background:#f1eee8;padding-top:7px}.est tr.tot td{font-weight:700;font-size:14px;border-top:2px solid var(--ink)}
.note{font-size:11.3px;color:var(--sub);line-height:1.55;margin-top:10px}
.doc h2{font-size:18px}.doc .meta{font-size:11.5px;color:var(--sub);margin:-4px 0 12px}
.doc h3{font-size:14px;margin:18px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.doc ul{padding-left:18px;line-height:1.6;font-size:12.6px}.doc li{margin-bottom:4px}
.doc table th,.doc table td{padding:6px;border-bottom:1px solid #ece8e0;text-align:left;vertical-align:top;font-size:12px}
.doc table th{width:64px;color:var(--sub);font-weight:500}
.doc table.small thead th{width:auto}.doc table small{display:block;color:var(--sub);font-size:10.5px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.callout{background:#f3efe6;border-left:3px solid var(--acc);padding:10px 12px;border-radius:0 10px 10px 0;font-size:12.5px;line-height:1.6;margin:12px 0}
.callout b{display:block;margin-bottom:2px}
.check li{list-style:'☐  '}
.src{padding-left:18px;font-size:11.5px;line-height:1.7}.src a{color:var(--hi)}
#shot{position:fixed;inset:0;background:rgba(20,18,16,.75);display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
#shot.on{display:flex}#shot div{max-width:900px;text-align:center}#shot img{max-width:100%;max-height:75vh;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
#shot p{color:#eee;font-size:12px;margin-top:10px}
@media (max-width:900px){
  header{flex-wrap:wrap;gap:8px;padding:8px 12px}
  .brand{flex-basis:100%}.brand span{font-size:11px}
  #views{flex:1}#views button{flex:1;padding:6px 8px}
  main{grid-template-columns:1fr;grid-template-rows:52vh 1fr}
  aside{border-left:0;border-top:1px solid var(--line)}
  #walkHud p{display:none}
  .rlabel{padding:2px 6px}.rlabel b{font-size:10.5px}.rlabel span{display:none}
}

/* ---- v2: 확장 비교 · 가구 배치 · 시나리오 ---- */
#cmp{display:none;position:absolute;inset:0;pointer-events:none}
#cmp.on{display:block}
#cmp .bar{position:absolute;height:auto;margin:0;border-radius:0;top:0;bottom:0;left:50%;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.15),0 0 12px rgba(0,0,0,.25);pointer-events:auto;cursor:ew-resize;touch-action:none}
#cmp .bar i{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:16px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.ctag{position:absolute;top:12px;left:12px;background:rgba(36,33,30,.82);color:#fff;font-size:12px;padding:6px 10px;border-radius:10px}
.ctag.r{left:auto;right:12px;background:rgba(47,111,98,.92)}
#cmpBefore{right:auto}
#selHud{position:absolute;inset:0;pointer-events:none;display:none}
#selHud.on{display:block}
#selTag{position:absolute;left:0;top:0;background:rgba(255,255,255,.95);border-radius:10px;padding:5px 10px;font-size:12px;box-shadow:0 2px 10px rgba(0,0,0,.15);white-space:nowrap}
#selTag em{display:block;font-style:normal;color:#c0392b;font-size:11px}
#selBar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.96);border-radius:14px;padding:6px;box-shadow:0 4px 18px rgba(0,0,0,.18);pointer-events:auto;max-width:calc(100% - 20px);overflow-x:auto}
#selBar button{padding:7px 10px;border-radius:9px;font-size:12.5px;white-space:nowrap}
#selBar button:hover{background:#f0ede7}
#selBar .pal{display:flex;gap:4px;padding:0 6px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
#selBar .pal i{width:22px;height:22px;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
#selBar .pal i.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--hi)}
.rlabel.exp{background:rgba(47,111,98,.9);color:#fff}.rlabel.exp span{color:#d9efe8}
#cmpBtn.on{background:var(--hi);color:#fff}
section.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tg b.pl{font-size:11px;color:var(--hi);background:#e7efe9;border-radius:5px;padding:0 5px;margin-left:4px}
.expsum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 10px}
.expsum>div{background:#f3f0ea;border-radius:10px;padding:8px 10px}
.expsum small{display:block;font-size:11px;color:var(--sub)}.expsum b{font-size:18px}.expsum span{display:block;font-size:11px;color:var(--sub)}
.btn.wide{width:100%}.btn.sm{padding:6px 10px;font-size:12px}.btn:disabled{opacity:.35;cursor:default}
.pros{margin-top:10px;font-size:12.3px}.pros summary{cursor:pointer;color:var(--hi);font-weight:500}.pros ul{padding-left:16px;line-height:1.6;margin-top:6px}
.seg.sm{margin-top:8px}.seg.sm button{font-size:12px;padding:5px 9px}
.slots{display:grid;gap:6px}
.slotc{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.slotc b{font-size:13px}.slotc small{flex:1;font-size:11px;color:var(--sub);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.slotc div{display:flex;gap:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.warn{font-style:normal;color:#c0392b;font-weight:700}
kbd{font-family:inherit;font-size:11px;background:#ece8e0;border-radius:4px;padding:0 4px}
.flib{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0 18px}
.fcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 6px 8px;text-align:left;display:flex;flex-direction:column;gap:1px;transition:.15s}
.fcard:hover{border-color:var(--hi);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.fcard img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#f4f2ee;border-radius:8px;margin-bottom:4px}
.fcard b{font-size:12.3px}.fcard small{font-size:10.8px;color:var(--sub)}.fcard span{font-size:11px;color:var(--hi);font-weight:700;margin-top:2px}
.flist{display:grid;gap:4px}
.frow{display:flex;align-items:center;gap:8px;text-align:left;background:#fff;border:1.5px solid transparent;border-radius:10px;padding:5px 8px}
.frow img{width:44px;height:33px;object-fit:contain;background:#f4f2ee;border-radius:6px}
.frow div{flex:1;min-width:0}.frow b{font-size:12.5px;display:block}.frow small{font-size:10.8px;color:var(--sub)}
.frow span{font-size:11px;color:var(--sub)}.frow.on{border-color:var(--hi);background:#f3f8f6}.frow.bad small{color:#c0392b}
@media (max-width:900px){
  #tabs button{font-size:12.5px;padding:11px 2px}
  #cmpBtn{padding:6px 8px;font-size:12px}
  #selBar button{padding:7px 8px;font-size:12px}
}

</style>

<body>
<div id="app">
  <header>
    <div class="brand"><b>33평 리모델링 시뮬레이터</b><span>화정마을4단지 아이파크가야 · 84㎡ · 2026 트렌드</span></div>
    <div id="views" class="seg"><button data-v="orbit">조감</button><button data-v="top">평면</button><button data-v="walk">워크스루</button></div>
    <div class="hr"><button id="cmpBtn" class="btn ghost" title="발코니 확장 전/후 비교">↔ 확장 전/후</button><span id="totalChip"></span><button id="snap" class="btn ghost" title="현재 화면 이미지">📷</button></div>
  </header>
  <main>
    <div id="viewport">
      <div id="labels"></div>
      <div id="walkHud">
        <select id="roomSel" aria-label="공간 이동"></select>
        <p>드래그: 둘러보기 · W/A/S/D·방향키: 이동 · Shift: 빠르게</p>
        <div id="pad"><button data-k="w">▲</button><button data-k="q">⟲</button><button data-k="s">▼</button><button data-k="e">⟳</button></div>
      </div>
      <div id="cmp"><div id="cmpBefore" class="ctag">확장 전 (현재 평면)</div><div id="cmpAfter" class="ctag r"></div><div class="bar"><i>↔</i></div></div>
      <div id="selHud"><div id="selTag"></div><div id="selBar"></div></div>
      <div id="toast"></div>
      <div id="loading"><div class="spin"></div><p>3D 모델과 자재 텍스처를 만들고 있어요…</p></div>
    </div>
    <aside>
      <nav id="tabs"><button data-t="concept">컨셉·옵션</button><button data-t="finish">마감재</button><button data-t="furn">가구 배치</button><button data-t="estimate">견적</button><button data-t="plan">기획서</button></nav>
      <div id="pane"></div>
    </aside>
  </main>
</div>
<div id="shot"><div><img id="shotImg" alt="스냅샷"><p>이미지를 길게 누르거나 우클릭해서 저장하세요 · 바깥을 누르면 닫혀요</p></div></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
// ============================================================
//  DATA : 평면 · 마감재 카탈로그 · 컨셉 프리셋 · 견적 기준
//  단위: 평면 좌표 mm (x: 좌→우, z: 북(상)→남(하)), 높이 mm
// ============================================================

const PLAN_META = {
  name: '화정마을4단지 아이파크가야 413동 · 84㎡ (33평형)',
  supply: 112.1, exclusive: 84.96, pyeong: 33,
  ceiling: 2300, doorH: 2100, wallT: 200,
};

// ---------- 공간 (중심선 기준 사각형) ----------
function getRooms(s) {
  const BAL = { floor: 'floor_balcony', wall: 'wall_balcony', kind: 'bal' };
  const E = s.exp || {};
  const bal = (id, name, xname, x1, z1, x2, z2, key, wall) => E[key]
    ? { id, name: xname, x1, z1, x2, z2, floor: 'floor_main', wall, kind: 'dry', expanded: key, lights: 2 }
    : { id, name, x1, z1, x2, z2, ...BAL, floorY: -60, lights: 1, expKey: key };
  return [

// ---------- 개구부 ----------
// line 'h' = z 고정 수평선(x a..b), 'v' = x 고정 수직선(z a..b)
// type: open | door | arch | window | slidewin | entry | slide(중문)
// swing: 문짝이 열리는 방향(+1: 좌표 증가 방향), hinge: 'a' | 'b'
function getOpenings(s) {
  const O = [
    { line: 'h', at: 8800, a: 4090, b: 9700, type: 'open' },
    { line: 'v', at: 4090, a: 7755, b: 9690, type: 'open' },
    { line: 'v', at: 8010, a: 7225, b: 8800, type: 'open' },
    { line: 'v', at: 8780, a: 8800, b: 10280, type: 'open' },
    { line: 'v', at: 9700, a: 9620, b: 10280, type: 'open' },
    { line: 'h', at: 7755, a: 3150, b: 3950, type: 'door', swing: -1, hinge: 'b' },   // 침실3
    { line: 'h', at: 9690, a: 3150, b: 3950, type: 'door', swing: 1, hinge: 'b' },    // 안방
    { line: 'h', at: 7755, a: 450, b: 1250, type: 'door', swing: -1, hinge: 'a', bath: true }, // 욕실1
    { line: 'v', at: 9700, a: 7650, b: 8450, type: 'door', swing: 1, hinge: 'b', bath: true }, // 욕실2
    { line: 'h', at: 10280, a: 8900, b: 9700, type: 'door', swing: 1, hinge: 'a' },   // 침실2
    { line: 'h', at: 5085, a: 4300, b: 5100, type: 'door', swing: -1, hinge: 'a', glass: true }, // 다용도실
    { line: 'v', at: 9700, a: 5300, b: 6300, type: 'entry' },                          // 현관문
    { line: 'h', at: 7225, a: 8110, b: 9600, type: 'slide' },                          // 중문
    // 창호
    { line: 'h', at: 5085, a: 5600, b: 7400, type: 'window', sill: 1000, head: 2100 },  // 주방창
    { line: 'h', at: 5085, a: 500, b: 1200, type: 'window', sill: 1500, head: 2100 },   // 욕실1 창
    { line: 'h', at: 3185, a: 4300, b: 7800, type: 'window', sill: 900, head: 2200, ext: true },
    { line: 'h', at: 3485, a: 200, b: 1545, type: 'window', sill: 900, head: 2200, ext: true },
  ];
  const E = s.exp || {}, xs = k => E[k] ? 450 : 900;
  // 발코니 외부 창 (확장 시 이중창·창대 낮춤)
  O.push({ line: 'h', at: 15015, a: 200, b: 3900, type: 'window', sill: xs('master'), head: 2200, ext: true });
  O.push({ line: 'h', at: 15015, a: 4290, b: 8580, type: 'window', sill: xs('living'), head: 2200, ext: true });
  O.push({ line: 'h', at: 14700, a: 8980, b: 11770, type: 'window', sill: xs('bed2'), head: 2200, ext: true });
  O.push({ line: 'h', at: 3485, a: 1945, b: 3900, type: 'window', sill: xs('bed3'), head: 2200, ext: true });
  // 실 ↔ 발코니 경계: 확장 시 창호 철거(상부 보 150mm 잔존), 비확장 시 미닫이 창
  const edge = (k, at, a, b, wa, wb) => O.push(E[k] ? { line: 'h', at, a, b, type: 'open', beam: true } : { line: 'h', at, a: wa, b: wb, type: 'slidewin', sill: 0, head: 2100 });
  edge('living', 13515, 4090, 8780, 4300, 8600);
  edge('master', 13515, 0, 4090, 300, 3800);
  edge('bed2', 13515, 8780, 11970, 9000, 11800);
  edge('bed3', 5085, 1745, 4090, 2100, 3800);
  if (!E.bed3) O.push({ line: 'v', at: 1745, a: 3485, b: 5085, type: 'open' });
  // 안방 드레스룸 구획(제안안) vs 원평면(복도형 전실)
  if (s.dress) O.push({ line: 'h', at: 9690, a: 200, b: 1000, type: 'arch' });
  else O.push({ line: 'v', at: 2600, a: 7755, b: 9690, type: 'open' });
  return O;
}

// ============================================================
//  TEXTURES : 캔버스 절차적 텍스처 (외부 이미지 없이 생성)
//  반환: { canvas, size:[u_m, v_m] }  — 텍스처 1장이 덮는 실제 크기(m)
// ============================================================

function rng(seed) {
  let a = seed >>> 0;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgbStr(r, g, b, a = 1) { return `rgba(${r | 0},${g | 0},${b | 0},${a})`; }
function shade(hex, f) { // f: -1..1 밝기 조절
  const [r, g, b] = hexToRgb(hex);
  const t = f < 0 ? 0 : 255, p = Math.abs(f);
  return rgbStr(r + (t - r) * p, g + (t - g) * p, b + (t - b) * p);
}
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

function noise(ctx, w, h, amt, R, scale = 1) {
  const img = ctx.getImageData(0, 0, w, h), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (R() - .5) * amt * scale; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  ctx.putImageData(img, 0, 0);
}

// 나뭇결 한 판 그리기 (x,y,w,h, 결 방향: 'v' 세로 / 'h' 가로)
function drawPlank(ctx, x, y, w, h, base, v, R, dir = 'v') {
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.fillStyle = shade(base, (R() - .5) * 2 * v); ctx.fillRect(x, y, w, h);
  const along = dir === 'v' ? h : w, across = dir === 'v' ? w : h;
  const lines = 10 + (R() * 10 | 0);
  for (let i = 0; i < lines; i++) {
    const off = R() * across, amp = 1 + R() * across * .06, freq = (1 + R() * 3) / along * Math.PI * 2, ph = R() * 6;
    ctx.strokeStyle = R() < .5 ? 'rgba(60,35,15,' + (.04 + R() * .08) + ')' : 'rgba(255,240,220,' + (.03 + R() * .05) + ')';
    ctx.lineWidth = .5 + R() * 1.6; ctx.beginPath();
    for (let s = 0; s <= along; s += 6) {
      const o = off + Math.sin(s * freq + ph) * amp;
      if (dir === 'v') { s === 0 ? ctx.moveTo(x + o, y + s) : ctx.lineTo(x + o, y + s); }
      else { s === 0 ? ctx.moveTo(x + s, y + o) : ctx.lineTo(x + s, y + o); }
    }
    ctx.stroke();
  }
  // 옹이 (드물게)
  if (R() < .25) {
    const kx = dir === 'v' ? x + R() * w : x + R() * w, ky = dir === 'v' ? y + R() * h : y + R() * h;
    const g = ctx.createRadialGradient(kx, ky, 0, kx, ky, across * .18);
    g.addColorStop(0, 'rgba(70,40,20,.35)'); g.addColorStop(1, 'rgba(70,40,20,0)');
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  }
  ctx.restore();
}

const TEX = {

    const c = mkCanvas(W, H), ctx = c.getContext('2d');

const VEIN = {
  stone(ctx, x, y, w, h, color, R) {
    for (let i = 0; i < 60; i++) {
      const px = x + R() * w, py = y + R() * h, rr = 10 + R() * w * .2;
      const g = ctx.createRadialGradient(px, py, 0, px, py, rr);
      const a = R() * .022; g.addColorStop(0, R() < .5 ? `rgba(255,255,255,${a})` : `rgba(90,75,60,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    }
  },
  concrete(ctx, x, y, w, h, color, R) {
    VEIN.stone(ctx, x, y, w, h, color, R);
    for (let i = 0; i < 120; i++) { ctx.fillStyle = `rgba(40,40,40,${R() * .25})`; const s = R() * 2.5; ctx.beginPath(); ctx.arc(x + R() * w, y + R() * h, s, 0, 7); ctx.fill(); }
  },
  marble(ctx, x, y, w, h, color, R) {
    VEIN.stone(ctx, x, y, w, h, color, R);
    const veins = 3 + (R() * 4 | 0);
    for (let v = 0; v < veins; v++) {
      let px = x + R() * w, py = y - 20, ang = Math.PI / 2 + (R() - .5) * 1.2;
      const main = R() < .45, pts = [[px, py]];
      while (py < y + h + 20 && pts.length < 400) { ang += (R() - .5) * .5; px += Math.cos(ang) * 8; py += Math.abs(Math.sin(ang)) * 8 + 1; pts.push([px, py]); }
      for (const [lw, a] of main ? [[7, .05], [3, .12], [1.2, .35]] : [[3, .05], [1, .2]]) {
        ctx.strokeStyle = `rgba(120,110,100,${a})`; ctx.lineWidth = lw; ctx.beginPath();
        pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
      }
      if (main) { ctx.strokeStyle = 'rgba(170,140,90,.25)'; ctx.lineWidth = 1; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0] + 3, p[1]) : ctx.moveTo(p[0] + 3, p[1])); ctx.stroke(); }
    }
  },
  trav(ctx, x, y, w, h, color, R) {
    VEIN.stone(ctx, x, y, w, h, color, R);
    for (let i = 0; i < 70; i++) {
      const yy = y + R() * h, a = R() * .09;
      ctx.fillStyle = R() < .5 ? `rgba(255,250,240,${a})` : `rgba(120,95,65,${a})`;
      ctx.fillRect(x, yy, w, 1 + R() * 6);
    }
    for (let i = 0; i < 90; i++) { ctx.fillStyle = `rgba(110,90,65,${.15 + R() * .2})`; ctx.beginPath(); ctx.ellipse(x + R() * w, y + R() * h, 1 + R() * 5, .6 + R() * 1.5, 0, 0, 7); ctx.fill(); }
  },
  terrazzo(ctx, x, y, w, h, color, R) {
    const chips = ['#8C8378', '#B9A58C', '#6E6A66', '#E9E4DC', '#A88F77', '#C9C1B5', '#7E7468'];
    for (let i = 0; i < w * h / 160; i++) {
      ctx.fillStyle = chips[R() * chips.length | 0];
      const cx = x + R() * w, cy = y + R() * h, s = 1.5 + R() * R() * 14, n = 4 + (R() * 3 | 0);
      ctx.beginPath();
      for (let k = 0; k < n; k++) { const a = k / n * 6.28 + R() * .6, rr = s * (.6 + R() * .5); k ? ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr) : ctx.moveTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); }
      ctx.closePath(); ctx.fill();
    }
  },
  speck(ctx, x, y, w, h, color, R) {
    for (let i = 0; i < w * h / 90; i++) { ctx.fillStyle = `rgba(${R() < .5 ? '90,90,90' : '200,200,200'},${R() * .5})`; ctx.fillRect(x + R() * w, y + R() * h, 1.5, 1.5); }
  },
};

function makeTexCanvas(item) {
  if (!item.tex || item.tex.k === 'paint') return null;
  const seed = hashStr(item.id);
  return TEX[item.tex.k](item.tex, item.color, seed);
}

// ---------- 패브릭 (직조 질감, 그레이스케일 → 색상 곱) ----------
function fabricCanvas(kind, seed) {
  const R = rng(seed), S = 256, c = mkCanvas(S, S), ctx = c.getContext('2d');
  ctx.fillStyle = '#e8e8e8'; ctx.fillRect(0, 0, S, S);
  if (kind === 'boucle') {
    for (let i = 0; i < 2600; i++) { const x = R() * S, y = R() * S, r = 1 + R() * 2.4; ctx.fillStyle = `rgba(${R() < .5 ? '255,255,255' : '120,120,120'},${.25 + R() * .3})`; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
  } else if (kind === 'leather') {
    for (let i = 0; i < 400; i++) { const x = R() * S, y = R() * S; ctx.strokeStyle = `rgba(90,90,90,${R() * .12})`; ctx.lineWidth = .6; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + (R() - .5) * 14, y + (R() - .5) * 14); ctx.stroke(); }
  } else if (kind === 'rug') {
    for (let y = 0; y < S; y += 3) for (let x = 0; x < S; x += 3) { ctx.fillStyle = `rgba(${R() < .5 ? '255,255,255' : '90,90,90'},${R() * .25})`; ctx.fillRect(x, y, 3, 3); }
    ctx.strokeStyle = 'rgba(80,80,80,.18)'; ctx.lineWidth = 6; ctx.strokeRect(20, 20, S - 40, S - 40);
  } else { // linen weave
    for (let i = 0; i < S; i += 2) { ctx.fillStyle = `rgba(0,0,0,${R() * .09})`; ctx.fillRect(0, i, S, 1); ctx.fillStyle = `rgba(255,255,255,${R() * .1})`; ctx.fillRect(i, 0, 1, S); }
  }
  noise(ctx, S, S, 14, R);
  return c;
}

// ---------- 아파트 입면 (주변 단지) ----------
function facadeCanvas(seed, lit) {
  const R = rng(seed), W = 512, Hh = 1024, c = mkCanvas(W, Hh), ctx = c.getContext('2d');
  ctx.fillStyle = lit ? '#1c1f26' : '#e9e6df'; ctx.fillRect(0, 0, W, Hh);
  const cols = 8, rows = 19, cw = W / cols, rh = Hh / rows;
  for (let r = 0; r < rows; r++) for (let i = 0; i < cols; i++) {
    const x = i * cw + cw * .12, y = r * rh + rh * .22, w = cw * .76, h = rh * .55;
    if (lit) { ctx.fillStyle = R() < .45 ? `rgba(255,${190 + R() * 40 | 0},${120 + R() * 50 | 0},${.6 + R() * .4})` : 'rgba(30,34,44,1)'; }
    else { ctx.fillStyle = R() < .15 ? '#9aa6ad' : '#7d8a93'; }
    ctx.fillRect(x, y, w, h);
    if (!lit) { ctx.fillStyle = '#f4f2ee'; ctx.fillRect(i * cw, r * rh + rh * .8, cw, rh * .08); }
  }
  return c;
}

// ---------- 지오메트리 헬퍼 (mm 입력) ----------
function rb(g, mat, w, h, d, x = 0, y = 0, z = 0, r = 20, rx = 0) {
  const rr = Math.max(1, Math.min(r, w / 2 - 1, h / 2 - 1, d / 2 - 1));
  const m = new THREE.Mesh(new RoundedBoxGeometry(w / 1000, h / 1000, d / 1000, 3, rr / 1000), mat);
  m.position.set(x / 1000, (y + h / 2) / 1000, z / 1000); m.rotation.x = rx;
  m.castShadow = m.receiveShadow = true; g.add(m); return m;
}
function cy(g, mat, r, h, x = 0, y = 0, z = 0, seg = 20, r2) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r / 1000, (r2 ?? r) / 1000, h / 1000, seg), mat);
  m.position.set(x / 1000, (y + h / 2) / 1000, z / 1000); m.castShadow = m.receiveShadow = true; g.add(m); return m;
}
function legs4(g, mat, w, d, h, inset = 60, r = 18, y = 0) { for (const sx of [-1, 1]) for (const sz of [-1, 1]) cy(g, mat, r, h, sx * (w / 2 - inset), y, sz * (d / 2 - inset), 10, r * .7); }

function mkSofa(g, w, d, f, chaise = 0) {
  const arm = 170, back = 200, seatH = 420, baseH = 300, legH = 70;
  legs4(g, fmBlack(), w, d, legH, 80, 14);
  rb(g, f, w, baseH - legH, d, 0, legH, 0, 30);                                           // 베이스
  rb(g, f, arm, 620 - legH, d, -w / 2 + arm / 2, legH, 0, 60);                            // 팔걸이
  rb(g, f, arm, 620 - legH, d, w / 2 - arm / 2, legH, 0, 60);
  rb(g, f, w - 2 * arm + 20, 760 - legH, back, 0, legH, -d / 2 + back / 2, 60);            // 등판
  const n = w > 2000 ? 3 : 2, cw = (w - 2 * arm) / n;
  for (let i = 0; i < n; i++) {
    const x = -w / 2 + arm + cw * (i + .5);
    rb(g, f, cw - 10, seatH - baseH + 40, d - back - 20, x, baseH - 20, back / 2, 70);    // 좌방석
    rb(g, f, cw - 30, 420, 190, x, seatH, -d / 2 + back + 60, 80, -.18);                  // 등쿠션
  }
  if (chaise) {
    const cxw = 900, x = w / 2 - cxw / 2, zc = d / 2 + chaise / 2;
    rb(g, f, cxw, baseH - legH, chaise + 40, x, legH, zc - 20, 30);
    rb(g, f, cxw - 30, seatH - baseH + 40, chaise + 20, x - 10, baseH - 20, zc - 10, 70);
    cy(g, fmBlack(), 14, legH, x + cxw / 2 - 80, 0, zc + chaise / 2 - 80, 8);
    cy(g, fmBlack(), 14, legH, x - cxw / 2 + 80, 0, zc + chaise / 2 - 80, 8);
  }
  const p = fabricMat('terra');
  rb(g, p, 420, 420, 140, -w / 2 + arm + 260, seatH, -d / 2 + back + 170, 70, -.25).rotation.z = .12;
  rb(g, fabricMat('oat'), 400, 400, 130, w / 2 - arm - 260, seatH, -d / 2 + back + 170, 70, -.25).rotation.z = -.1;
}

  rb(g, wd, 720, 40, 740, 0, 340, 20, 10);

}

function fmtHour(h) { const m = Math.round((h % 1) * 60); return `${Math.floor(h)}:${String(m).padStart(2, '0')}`; }
function sunText(si) {
  if (!si) return '';
  const alt = si.alt * 180 / Math.PI, az = si.az * 180 / Math.PI;
  if (alt <= 0) return '해가 진 시간이에요 (태양 고도 0° 이하)';
  const depth = Math.min(15, 2.2 / Math.tan(si.alt) * Math.max(0, Math.cos(si.az)));
  return `태양 고도 <b>${alt.toFixed(0)}°</b> · 방위 ${az > 0 ? '남서' : '남동'} ${Math.abs(az).toFixed(0)}° · 창 높이 2.2m 기준 햇빛이 실내 약 <b>${depth.toFixed(1)}m</b>까지 들어와요`;
}

function loadSlot(k) {

      thumbR = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
      thumbR.setSize(160, 120); thumbR.toneMapping = THREE.NeutralToneMapping; thumbR.outputColorSpace = THREE.SRGBColorSpace;
      thumbScene = new THREE.Scene(); thumbScene.environment = new THREE.PMREMGenerator(thumbR).fromScene(new RoomEnvironment(), .04).texture; thumbScene.environmentIntensity = .7;
      const dl = new THREE.DirectionalLight('#fff', 1.6); dl.position.set(2, 4, 3); thumbScene.add(dl, new THREE.HemisphereLight('#fff', '#ccc', .6));
      thumbCam = new THREE.PerspectiveCamera(30, 4 / 3, .01, 50);
    }
    const L = FURN_BY[t], g = new THREE.Group(); L.make(g, { c: L.def, t }); thumbScene.add(g);
    const b = new THREE.Box3().setFromObject(g), c = b.getCenter(new THREE.Vector3()), s = b.getSize(new THREE.Vector3()).length();
    thumbCam.position.set(c.x + s * .9, c.y + s * .75, c.z + s * 1.3); thumbCam.lookAt(c);
    thumbR.render(thumbScene, thumbCam);
    thumbCache[t] = thumbR.domElement.toDataURL('image/png');
    thumbScene.remove(g); g.traverse(o => o.geometry && o.geometry.dispose());
  } catch (e) { thumbCache[t] = ''; }
  return thumbCache[t];
}

// ---------- 가구 탭 ----------
let furnCat = '거실';
function furnBudget() { return state.furniture.reduce((s, f) => s + (FURN_BY[f.t].price || 0), 0); }
function roomNameAt(x, z) { const r = roomAt(x, z, MAIN.rooms); return r ? r.name : '실 밖'; }
function renderFurn() {
  const lib = FURN_LIB.filter(f => f.cat === furnCat);
  const placed = state.furniture.map(f => ({ f, L: FURN_BY[f.t], iss: checkFurn(f) }));
  const bad = placed.filter(p => p.iss.length).length;
  $('#pane').innerHTML = `
    <section class="sum"><div class="big"><small>배치된 가구 ${placed.length}점 · 가구 예산 (참고)</small><b>${man(furnBudget())}원</b><span>${bad ? `<em class="warn">간섭 ${bad}건</em> 빨간 테두리 가구를 확인하세요` : '간섭 없음 ✓'}</span></div>
      <div class="row2"><button class="btn ghost" id="fDefault">기본 배치로</button><button class="btn ghost" id="fEmpty">모두 비우기</button></div></section>
    <p class="hint"><b>사용법</b> 3D에서 가구를 탭해 선택 → 다시 끌어서 이동해요. 회전·복제·삭제·색상은 화면 아래 도구막대에서 바꿔요. PC는 <kbd>R</kbd> 회전, <kbd>Del</kbd> 삭제, 방향키로 5cm씩 이동, <kbd>Shift</kbd>+드래그로 1cm 단위 이동이에요. 벽·붙박이장·문 열림 반경과 겹치면 빨간색으로 알려줘요.</p>
    <div class="zones">${FURN_CATS.map(c => `<button data-fc="${c}" class="${furnCat === c ? 'on' : ''}">${c}</button>`).join('')}</div>
    <div class="flib">${lib.map(L => `<button class="fcard" data-add="${L.id}"><img src="${furnThumb(L.id)}" alt=""><b>${L.name}</b><small>${L.w}×${L.d}mm · ${man(L.price)}원</small><span>+ 추가</span></button>`).join('')}</div>
    <section><h2>배치 목록</h2><div class="flist">${placed.map(({ f, L, iss }) => `<button class="frow ${f.u === selected ? 'on' : ''} ${iss.length ? 'bad' : ''}" data-sel="${f.u}"><img src="${furnThumb(f.t)}" alt=""><div><b>${L.name}</b><small>${roomNameAt(f.x, f.z)} · ${L.w}×${L.d} · ${Math.round(((f.r || 0) * 180 / Math.PI) % 360)}°${iss.length ? ' · ⚠ ' + iss.join(', ') : ''}</small></div><span>${man(L.price)}</span></button>`).join('') || '<p class="hint">배치된 가구가 없어요. 위 라이브러리에서 추가하세요.</p>'}</div></section>`;
  $('#pane').querySelectorAll('[data-fc]').forEach(b => b.onclick = () => { furnCat = b.dataset.fc; keepScroll(renderFurn); });
  $('#pane').querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
    if (state.view === 'walk') setView('orbit');
    const f = addFurn(b.dataset.add); toast(`'${FURN_BY[f.t].name}'를 화면 중앙에 놓았어요. 끌어서 옮기세요`); keepScroll(renderFurn); updateTotal();
  });
  $('#pane').querySelectorAll('[data-sel]').forEach(b => b.onclick = () => {
    if (state.view === 'walk') setView('orbit');
    const f = state.furniture.find(x => x.u === b.dataset.sel); selectFurn(f.u);
    const t = new THREE.Vector3(WX(f.x), 0, WZ(f.z)); tween = { from: controls.target.clone(), to: t, fromP: camera.position.clone(), toP: t.clone().add(new THREE.Vector3(2.6, 5.4, 4.6)), t: 0 };
  });
  $('#fDefault').onclick = () => { resetFurniture(false); keepScroll(renderFurn); updateTotal(); toast('기본 배치로 되돌렸어요'); };
  $('#fEmpty').onclick = () => { resetFurniture(true); keepScroll(renderFurn); updateTotal(); toast('가구를 모두 치웠어요'); };
}
function keepScroll(fn) { const y = $('#pane').scrollTop; fn(); $('#pane').scrollTop = y; }

// ---------- 선택 HUD ----------
function renderSelHud() {
  const f = selected && state.furniture.find(x => x.u === selected);
  if (!f) { $('#selBar').innerHTML = ''; $('#selTag').innerHTML = ''; return; }
  const L = FURN_BY[f.t], iss = checkFurn(f), pal = L.pal ? FCOL[L.pal] : null;
  $('#selTag').innerHTML = `<b>${L.name}</b> ${L.w}×${L.d}${iss.length ? `<em>⚠ ${iss.join(' · ')}</em>` : ''}`;
  $('#selBar').innerHTML = `<button data-a="rot90" title="90° 회전 (R)">⟳ 90°</button><button data-a="rot15" title="15° 회전">↻ 15°</button><button data-a="dup" title="복제">⧉ 복제</button><button data-a="del" title="삭제 (Del)">🗑 삭제</button>
    ${pal ? `<span class="pal">${pal.map(c => `<i data-c="${c.id}" title="${c.name}" class="${f.c === c.id ? 'on' : ''}" style="background:${c.color}"></i>`).join('')}</span>` : ''}<button data-a="x" title="선택 해제 (Esc)">✕</button>`;
  $('#selBar').querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    const a = b.dataset.a;
    if (a === 'rot90') furnPatch(f.u, { r: ((f.r || 0) + Math.PI / 2) % (Math.PI * 2) });
    if (a === 'rot15') furnPatch(f.u, { r: ((f.r || 0) + Math.PI / 12) % (Math.PI * 2) });
    if (a === 'dup') { const n = addFurn(f.t, [f.x + 300, f.z + 300]); furnPatch(n.u, { r: f.r, c: f.c }, true); }
    if (a === 'del') { deleteFurn(f.u); updateTotal(); }
    if (a === 'x') selectFurn(null);
    saveState(); afterFurnChange();
  });
  $('#selBar').querySelectorAll('[data-c]').forEach(i => i.onclick = () => { furnPatch(f.u, { c: i.dataset.c }, true); saveState(); afterFurnChange(); });
}
function afterFurnChange() { renderSelHud(); if (tab === 'furn') keepScroll(renderFurn); updateTotal(); }
window.onFurnSelect = () => { renderSelHud(); if (tab === 'furn') keepScroll(renderFurn); };
window.onFurnChange = () => afterFurnChange();
let hudTick = 0;
setInterval(() => { if (dragging && ++hudTick % 2 === 0) renderSelHud(); }, 120);

// ---------- 기획서 추가 섹션 ----------
function planExpansion() {
  const on = EXP_INFO.filter(e => state.exp[e.k]);
  const add = on.reduce((s, e) => s + e.area, 0);
  return `<h3>3-1. 발코니 확장 분석</h3>
    <table class="small"><thead><tr><th>발코니</th><th>면적</th><th>현재 계획</th><th>공사비(추정)</th></tr></thead><tbody>
    ${EXP_INFO.map(e => `<tr><td>${e.name}</td><td>+${e.area}㎡</td><td>${state.exp[e.k] ? '<b>확장</b>' : '비확장'}</td><td>${man(OPTION_COSTS['exp_' + e.k].amt)}원</td></tr>`).join('')}</tbody></table>
    <p class="note">실사용 면적: 전용 84.96㎡ → <b>${(84.96 + add).toFixed(1)}㎡</b> (${add ? '+' + (add / 3.3058).toFixed(1) + '평' : '변동 없음'}). 확장부는 단열재·이중창·바닥난방 연장이 필수이고, 북측(침실3)은 결로 위험이 가장 커서 비확장을 권해요. 상단 '↔ 확장 전/후' 버튼으로 같은 시점에서 비교할 수 있어요.</p>`;
}
function planFurniture() {
  const byRoom = {};
  for (const f of state.furniture) { const n = roomNameAt(f.x, f.z); (byRoom[n] = byRoom[n] || []).push(FURN_BY[f.t].name); }
  const bad = state.furniture.filter(f => checkFurn(f).length).length;
  return `<h3>3-2. 가구 배치 계획</h3>
    <table class="small"><thead><tr><th>공간</th><th>가구</th></tr></thead><tbody>${Object.entries(byRoom).map(([r, l]) => `<tr><td>${r}</td><td>${l.join(', ')}</td></tr>`).join('')}</tbody></table>
    <p class="note">가구 ${state.furniture.length}점 · 예산 약 ${man(furnBudget())}원(공사비 별도, 중급 브랜드 추정) · 간섭 ${bad}건. 침대·소파 같은 큰 가구는 붙박이장 문 열림(600mm)과 통로 폭(최소 600~800mm)을 확보했는지 3D에서 확인하세요.</p>`;
}

// ---------- 이벤트 연결 ----------
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); $('#pane').scrollTop = 0; });
document.querySelectorAll('#views button').forEach(b => b.onclick = () => setView(b.dataset.v));
window.onViewChange = () => { document.querySelectorAll('#views button').forEach(b => b.classList.toggle('on', b.dataset.v === state.view)); };
window.onCompareChange = () => { $('#cmpBtn').classList.toggle('on', compare.on); if (tab === 'concept') keepScroll(renderConcept); };
window.onSlotPick = (slot, room) => {
  tab = 'finish'; zone = CATALOG[slot].zone; render(slot); flashSlot(slot);
  const r = MAIN.rooms.find(r => r.id === room); toast(`${r ? r.name + ' · ' : ''}${CATALOG[slot].label}`);
};
window.onRoomPick = id => { if (state.view === 'walk') goSpot(id); };
window.onBuilt = () => { updateTotal(); renderSelHud(); };
window.toast = toast;
$('#cmpBtn').onclick = () => setCompare(!compare.on);
const roomSel = $('#roomSel');
roomSel.innerHTML = Object.keys(SPOTS).map(k => `<option value="${k}">${(getRooms(state).find(r => r.id === k) || {}).name || k}</option>`).join('');
roomSel.onchange = () => goSpot(roomSel.value);
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); walk.keys[k] = true; }, off = () => { walk.keys[k] = false; };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);
});
$('#snap').onclick = () => { $('#shotImg').src = snapshot(); $('#shot').classList.add('on'); };
$('#shot').onclick = e => { if (e.target.id !== 'shotImg') $('#shot').classList.remove('on'); };

// ---------- 시작 ----------
applyAll(); build(); render(); updateTotal(); window.onViewChange();
requestAnimationFrame(loop);
setTimeout(() => $('#loading').classList.add('off'), 200);
window.SIM = { state, setView, goSpot, applyLighting, build, applyConcept, estimate, setCompare, addFurn, selectFurn, furnPatch, checkFurn, compare, get MAIN() { return MAIN; } };

</script>
