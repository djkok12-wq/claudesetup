# systemkpc.com — Nginx 리버스 프록시 (Caddy 대신 Nginx를 쓸 때)
# 배치: /etc/nginx/sites-available/systemkpc.com → sites-enabled 에 심볼릭 링크
# 인증서: sudo certbot --nginx -d systemkpc.com   (Let's Encrypt, 무료·자동갱신)
#
# !! 중요: 이 파일은 server_name 이 systemkpc.com 인 블록만 추가한다.
#    airkpc.com · airkpc.cafe24.com 설정은 절대 건드리지 않는다.

server {
    listen 80;
    listen [::]:80;
    server_name systemkpc.com www.systemkpc.com;
    # certbot 이 아래로 리다이렉트를 자동 추가한다
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name systemkpc.com www.systemkpc.com;

    ssl_certificate     /etc/letsencrypt/live/systemkpc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/systemkpc.com/privkey.pem;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # 운영 중 API 문서 차단
    location /api/docs { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # 쿠키 Secure 판정·리다이렉트에 필요
        proxy_read_timeout 120s;
    }
}
